<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 620" width="100%" height="100%">
  <!-- Vertical Main Logo (Item 1 on Brand Sheet) -->
  <g transform="translate(25, 10)">
    
    <!-- Monogram TD Symbol -->
    <g transform="translate(50, 0)">
      <!-- T Stem & Top Bar -->
      <path d="M 10 15 L 175 15 C 190 15 200 25 200 40 C 200 55 190 65 175 65 L 136 65 L 136 220 C 136 235 124 245 109 245 C 94 245 82 235 82 220 L 82 65 L 10 65 C -5 65 -15 55 -15 40 C -15 25 -5 15 10 15 Z" fill="#0052FF"/>

      <!-- Finger Tap Icon at base of T -->
      <g transform="translate(48, 145)">
        <circle cx="60" cy="40" r="18" fill="none" stroke="#0052FF" stroke-width="7"/>
        <path d="M 60 40 C 60 30 68 22 78 22 C 88 22 96 30 96 40 L 96 95 C 99 92 104 90 109 90 C 118 90 125 97 125 106 L 125 120 C 125 155 97 182 62 182 C 37 182 16 167 7 144 L -5 109 C -8 102 -6 93 1 88 C 8 83 18 85 23 92 L 31 107 L 60 107 Z" fill="#001233"/>
      </g>

      <!-- D Outer Loop -->
      <path d="M 180 15 L 255 15 C 345 15 410 75 410 165 C 410 255 345 315 255 315 L 140 315 C 115 315 105 305 105 290 C 105 275 125 265 140 265 L 255 265 C 315 265 350 225 350 165 C 350 105 315 65 255 65 L 180 65 Z" fill="#001233"/>

      <!-- NFC Waves inside D -->
      <g fill="none" stroke="#0052FF" stroke-width="22" stroke-linecap="round">
        <path d="M 240 115 A 60 60 0 0 1 240 215"/>
        <path d="M 275 90 A 95 95 0 0 1 275 240"/>
      </g>
    </g>

    <!-- Main Title Text: TapDID -->
    <text x="250" y="440" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="120" text-anchor="middle" letter-spacing="-1">
      <tspan fill="#001233">Tap</tspan>
      <tspan fill="#0052FF">DID</tspan>
    </text>

    <!-- Tagline Text -->
    <g transform="translate(250, 500)">
      <line x1="-220" y1="-8" x2="-160" y2="-8" stroke="#0052FF" stroke-width="5" stroke-linecap="round"/>
      <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="24" fill="#1E293B" text-anchor="middle" letter-spacing="0.2">Your Digital Identity. One Tap Away.</text>
      <line x1="160" y1="-8" x2="220" y2="-8" stroke="#0052FF" stroke-width="5" stroke-linecap="round"/>
    </g>

  </g>
</svg>
